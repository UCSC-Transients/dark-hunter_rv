global:
  max_chunk_err_kms: 50.0
  min_mask_line_count: 8
  max_telluric_fraction: 0.25
  max_ccf_asymmetry: 0.35
  min_ccf_peak: 0.02
  min_ccf_peak_snr: 2.75
  max_fft_ccf_flat_rss_ratio: 0.88
instruments:
  APF:
    max_chunk_err_kms: 25.0
    min_mask_line_count: 8
    max_telluric_fraction: 0.22
    max_ccf_asymmetry: 0.55
    min_ccf_peak: 0.03
    min_ccf_peak_snr: 2.45
    max_fft_ccf_flat_rss_ratio: 0.88
  HIRES:
    max_chunk_err_kms: 50.0
    min_mask_line_count: 8
    max_telluric_fraction: 0.25
    max_ccf_asymmetry: 0.35
    min_ccf_peak: 0.02
    min_ccf_peak_snr: 2.75
    max_fft_ccf_flat_rss_ratio: 0.88
# Trust-weighted IVW stack (step 02b). Default on — scales 1/σ² by residual /
# telluric / CCF-quality factors. Disable with --no-trust-weights. Columns always written.
trust_weights:
  enabled: true
  residual_scale_kms: 5.0
  residual_power: 2.0
  telluric_soft_max: 0.10
  telluric_hard_max: 0.30
  ccf_snr_ref: 8.0
  max_ccf_asymmetry: 0.55
  min_trust: 0.05
